formatter:
  fields: # list of fields to format in JSON
    - type
    - time_received_ns
    - sequence_num
    - sampling_rate
    - sampler_address
    - time_flow_start_ns
    - time_flow_end_ns
    - bytes
    - packets
    - src_addr
    - dst_addr
    - etype
    - proto
    - src_port
    - dst_port
    - in_if
    - out_if
    - src_mac
    - dst_mac
    - src_vlan
    - dst_vlan
    - vlan_id
    - ip_tos
    - forwarding_status
    - ip_ttl
    - ip_flags
    - tcp_flags
    - icmp_type
    - icmp_code
    - ipv6_flow_label
    - fragment_id
    - fragment_offset
    - src_as
    - dst_as
    - next_hop
    - next_hop_as
    - src_net
    - dst_net
    - bgp_next_hop
    - bgp_communities
    - as_path
    - mpls_ttl
    - mpls_label
    - mpls_ip
    - observation_domain_id
    - observation_point_id
    - layer_stack
    - layer_size
    - ipv6_routing_header_addresses
    - ipv6_routing_header_seg_left
    # upstream v2.2.6 dynamic mappings
    - flow_direction
    - bi_flow_direction
    - ingress_vrf_id
    - egress_vrf_id
    - icmp_name # virtual column
    - csum # udp checksum
    # NAT mappings added by this isolated test
    - post_nat_src_addr
    - post_nat_dst_addr
    - post_napt_src_port
    - post_napt_dst_port
    - flow_start_sys_uptime_ms
    - flow_end_sys_uptime_ms
    - system_init_time_ms
    - native_flow_start_marker
    - native_flow_end_marker
    - flow_start_delta_marker
    - flow_end_delta_marker
  key:
    - sampler_address
  protobuf: # manual protobuf fields addition
    - name: flow_direction
      index: 42
      type: varint
    - name: bi_flow_direction
      index: 41
      type: varint
    - name: ingress_vrf_id
      index: 39
      type: varint
    - name: egress_vrf_id
      index: 40
      type: varint
    - name: csum
      index: 999
      type: varint
    - name: post_nat_src_addr
      index: 1001
      type: bytes
    - name: post_nat_dst_addr
      index: 1002
      type: bytes
    - name: post_napt_src_port
      index: 1003
      type: varint
    - name: post_napt_dst_port
      index: 1004
      type: varint
    - name: flow_start_sys_uptime_ms
      index: 1005
      type: varint
    - name: flow_end_sys_uptime_ms
      index: 1006
      type: varint
    - name: system_init_time_ms
      index: 1007
      type: varint
    - name: native_flow_start_marker
      index: 1008
      type: varint
    - name: native_flow_end_marker
      index: 1009
      type: varint
    - name: flow_start_delta_marker
      index: 1010
      type: varint
    - name: flow_end_delta_marker
      index: 1011
      type: varint
  render:
    post_nat_src_addr: ip
    post_nat_dst_addr: ip
# Decoder mappings
ipfix:
  mapping:
    - field: 61
      destination: flow_direction
    - field: 239
      destination: bi_flow_direction
    - field: 234
      destination: ingress_vrf_id
    - field: 235
      destination: egress_vrf_id
    - field: 225
      destination: post_nat_src_addr
    - field: 226
      destination: post_nat_dst_addr
    - field: 227
      destination: post_napt_src_port
    - field: 228
      destination: post_napt_dst_port
    - field: 22
      destination: flow_start_sys_uptime_ms
    - field: 21
      destination: flow_end_sys_uptime_ms
    - field: 160
      destination: system_init_time_ms
    # GoFlow2 exposes a calculated time_flow_* value but does not expose
    # whether it came from a native absolute IE or its export-time fallback.
    # These markers retain field presence without changing GoFlow2's native
    # timestamp conversion.
    - field: 150
      destination: native_flow_start_marker
    - field: 152
      destination: native_flow_start_marker
    - field: 154
      destination: native_flow_start_marker
    - field: 156
      destination: native_flow_start_marker
    - field: 151
      destination: native_flow_end_marker
    - field: 153
      destination: native_flow_end_marker
    - field: 155
      destination: native_flow_end_marker
    - field: 157
      destination: native_flow_end_marker
    - field: 158
      destination: flow_start_delta_marker
    - field: 159
      destination: flow_end_delta_marker
netflowv9:
  mapping:
    - field: 34 # samplingInterval provided within the template
      destination: sampling_rate
      endian: little
    - field: 61
      destination: flow_direction
sflow:
  ports:
    - proto: "udp"
      dir: "dst"
      port: 3544
      parser: "teredo-dst"
    - proto: "udp"
      dir: "both"
      port: 4754
      parser: "gre"
    - proto: "udp"
      dir: "both"
      port: 6081
      parser: "geneve"
  mapping:
    - layer: "udp"
      offset: 48
      length: 16
      destination: csum
    - layer: "tcp"
      offset: 128
      length: 16
      destination: csum
